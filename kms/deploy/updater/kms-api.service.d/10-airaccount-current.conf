# /etc/systemd/system/kms-api.service.d/10-airaccount-current.conf
#
# 让 kms-api 从 updater 管理的 current 软链启动,否则 updater 切了 current 但服务仍跑旧二进制
# (Codex 评审「严重」项:更新在生产上会变成静默 no-op)。
#
# ⚠️ 安装本 drop-in 是 updater 在生产生效的前提。它属于设计文档 §10 的 installer 版本化目录迁移,
#    这里随 updater 一起提供,避免增量落地即空转。迁移脚本需保证 /opt/airaccount/current 已就位。
[Service]
ExecStart=
ExecStart=/opt/airaccount/current/kms-api-server
